name: Deploy sanitized Tactical Recruiting demo to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "rrhh-demo/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tactical-recruiting-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out project source
        uses: actions/checkout@v4

      - name: Validate demo privacy and browser-only behavior
        run: python scripts/validate_demo.py

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload demo only
        uses: actions/upload-pages-artifact@v3
        with:
          path: rrhh-demo

      - name: Publish public demo
        id: deployment
        uses: actions/deploy-pages@v5
